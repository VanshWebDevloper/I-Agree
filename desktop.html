<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I Agree</title>
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/windows.css">
</head>
<body>
  
  <div id="debug-reset" style="
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 999999;
    background: #ffff00;
    color: black;
    padding: 12px;
    border: 3px solid #ff0000;
  ">
    <button onclick="tryReset()">RESET GAME</button>
  </div>

  <script>
    function tryReset() {
    try {
      localStorage.clear();
      alert("Storage cleared!");
      location.reload();
      } catch (e) {
       alert("Error: " + e.message);
      }
    }
  </script>
</body>

  <div id="monitor">
    
    <div id="screen">
      <div id="screen-content">
        
        <div class="desktop-icon">
          
          <a href="apps/store.html"><img src="images/softostore.png" alt="SoftOStore">
          <span>SoftOStore</span></a>

          <a href="apps/browser.html"><img src="images/browser.png" alt="Browser">
            
          <a href="apps/camerafolder.html"><img src="images/folder.png" alt="cameraFolder">
          <span>Camera Folder</span></a>
        </div>
      </div>
    </div>

  <audio id="music" src="sounds/music.mp3"></audio>
  <script src="js/desktop.js"></script>
  <script src="js/windowManager.js"></script>
  <script src="js/apps.js"></script>
</body>
</html>
